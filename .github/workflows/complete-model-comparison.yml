name: Complete-pool and historical model comparison
on:
  push:
    branches: [codex/complete-labels-comparison-20260922]
    paths: [.github/workflows/complete-model-comparison.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: [{"kind": "slate", "name": "six_nations_2025_r1", "competition": "six_nations"}, {"kind": "slate", "name": "six_nations_2025_r2", "competition": "six_nations"}, {"kind": "slate", "name": "six_nations_2025_r3", "competition": "six_nations"}, {"kind": "slate", "name": "six_nations_2025_r4", "competition": "six_nations"}, {"kind": "slate", "name": "six_nations_2025_r5", "competition": "six_nations"}, {"kind": "slate", "name": "six_nations_2026_r1", "competition": "six_nations"}, {"kind": "slate", "name": "six_nations_2026_r2", "competition": "six_nations"}, {"kind": "slate", "name": "six_nations_2026_r3", "competition": "six_nations"}, {"kind": "slate", "name": "six_nations_2026_r4", "competition": "six_nations"}, {"kind": "slate", "name": "six_nations_2026_r5", "competition": "six_nations"}, {"kind": "slate", "name": "ncr_2026_r1", "competition": "ncr"}, {"kind": "slate", "name": "ncr_2026_r2", "competition": "ncr"}, {"kind": "slate", "name": "ncr_2026_r3", "competition": "ncr"}, {"kind": "raw", "name": "six_nations_2022", "competition": "raw"}, {"kind": "raw", "name": "summer_internationals_2022", "competition": "raw"}, {"kind": "raw", "name": "rugby_championship_2022", "competition": "raw"}, {"kind": "raw", "name": "autumn_internationals_2022", "competition": "raw"}, {"kind": "raw", "name": "six_nations_2023", "competition": "raw"}, {"kind": "raw", "name": "rugby_championship_2023", "competition": "raw"}, {"kind": "raw", "name": "summer_internationals_2023", "competition": "raw"}, {"kind": "raw", "name": "rugby_world_cup_2023", "competition": "raw"}, {"kind": "raw", "name": "six_nations_2024", "competition": "raw"}, {"kind": "raw", "name": "summer_internationals_2024", "competition": "raw"}, {"kind": "raw", "name": "rugby_championship_2024", "competition": "raw"}, {"kind": "raw", "name": "pacific_nations_cup_2024", "competition": "raw"}, {"kind": "raw", "name": "autumn_internationals_2024", "competition": "raw"}, {"kind": "raw", "name": "six_nations_2025", "competition": "raw"}, {"kind": "raw", "name": "british_irish_lions_2025", "competition": "raw"}, {"kind": "raw", "name": "summer_internationals_2025", "competition": "raw"}, {"kind": "raw", "name": "rugby_championship_2025", "competition": "raw"}, {"kind": "raw", "name": "pacific_nations_cup_2025", "competition": "raw"}, {"kind": "raw", "name": "autumn_internationals_2025", "competition": "raw"}, {"kind": "raw", "name": "six_nations_2026", "competition": "raw"}, {"kind": "raw", "name": "nations_championship_2026", "competition": "raw"}]
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-model.txt
      - name: Install the pinned numerical environment
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-model.txt requests beautifulsoup4 pytest
          git lfs pull --include='data/ncr/club_player_match.csv' --exclude=''
          python model_env_preflight.py
          python -m pip freeze > environment.txt
          git rev-parse HEAD > source-commit.txt
      - name: Run existing focused checks
        run: python -m pytest -q tests/test_unified_raw_benchmark.py tests/test_rolling_history.py tests/test_unified_v4.py > tests.txt
      - name: Run comparison with corrected labels and prior-supported roles
        env:
          KIND: ${{ matrix.kind }}
          JOB_NAME: ${{ matrix.name }}
          COMPETITION: ${{ matrix.competition }}
        run: |
          if [ "$KIND" = raw ]; then
            python -u -m research.raw_comparison --fold "$JOB_NAME" --output results > run.log 2>&1
          else
            python -u -m model.unified.rolling_eval --native-categories --competitions "$COMPETITION" --round-job "$JOB_NAME" --output results > run.log 2>&1
          fi
      - name: Package predictions and verification evidence
        if: always()
        run: |
          mkdir -p results
          touch run.log tests.txt environment.txt source-commit.txt
          tar --exclude='results/inputs/player_match.csv' --exclude='*.pkl' -czf evidence.tar.gz results run.log tests.txt environment.txt source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-${{ matrix.kind }}-${{ matrix.name }}
          path: evidence.tar.gz
          retention-days: 30
          if-no-files-found: error
