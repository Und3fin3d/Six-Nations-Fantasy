name: Registered full conditional duration domain comparison
on:
  push:
    branches: [codex/fantasy-decision-workflow]
    paths: [.github/workflows/conditional-duration-fit.yml]
permissions:
  contents: read
  actions: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.matrix.outputs.jobs }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          persist-credentials: false
      - id: matrix
        run: |
          python - <<'PY'
          import json, os
          root = 'data/unified/decision_continuation_2026-09-26/run-36258801997/prepared'
          jobs = json.load(open(f'{root}/jobs.json'))
          units = [unit for job in jobs for unit in job['units']]
          if len(jobs) != 27 or len(units) != 28 or len(set(units)) != 28:
              raise ValueError('Registered full comparison cohort is incomplete')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('jobs=' + json.dumps({'include': [{'job': job['job']} for job in jobs]}) + '\n')
          PY
  fit:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.matrix.outputs.jobs) }}
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OMP_THREAD_LIMIT: '2'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-model.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Und3fin3d/Six-Nations-Fantasy
          run-id: 36258801997
          name: conditional-duration-prepared-36258801997
          path: ${{ runner.temp }}/prepared-inputs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Und3fin3d/Six-Nations-Fantasy
          run-id: 36257138991
          name: research-verified-stores-and-registrations
          path: ${{ runner.temp }}/transport
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Und3fin3d/Six-Nations-Fantasy
          run-id: 36259223104
          name: conditional-duration-${{ matrix.job }}-36259223104
          path: ${{ runner.temp }}/prior-controls
      - name: Install exact dependencies and verify read-only sources
        id: environment
        run: |
          set -euo pipefail
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-model.txt requests beautifulsoup4 pytest
          python model_env_preflight.py
          git lfs pull --include='data/ncr/club_player_match.csv' --exclude=''
          mkdir -p "$RUNNER_TEMP/duration/stores" "$RUNNER_TEMP/evidence"
          cd "$RUNNER_TEMP/transport"
          grep 'stores.tar.gz$' sha256.txt | sha256sum -c -
          tar -xzf stores.tar.gz -C "$RUNNER_TEMP/duration/stores"
          cd "$GITHUB_WORKSPACE"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/source-commit.txt"
          python -m pip freeze > "$RUNNER_TEMP/evidence/environment.txt"
          python -m py_compile research/duration_domain_model.py research/conditional_duration_run.py research/conditional_duration_metrics.py
          python -c 'from research.conditional_duration_metrics import load_outcome_audit; load_outcome_audit(); import research.conditional_duration_run'
          for NAME in empirical_event robust_empirical_event v4_corrected_full_refit v4_joint_support_control; do
            test -s "$RUNNER_TEMP/prior-controls/study/models/$NAME.pkl.gz"
            test -s "$RUNNER_TEMP/prior-controls/study/models/$NAME.json"
          done
      - name: Run existing focused checks once
        if: matrix.job == 'lock_00'
        id: checks
        continue-on-error: true
        run: |
          python -m pytest -q tests/test_rolling_history.py::test_expected_six_nations_points_accounts_for_metres_distribution tests/test_rolling_history.py::test_robust_minutes_use_international_role_not_club_minutes tests/test_rolling_history.py::test_robust_position_rate_uses_observed_exposure tests/test_unified_ncr_gw_eval.py > "$RUNNER_TEMP/evidence/existing-checks.txt" 2>&1
      - name: Fit and evaluate the bounded primary architecture
        id: bounded
        if: always() && steps.environment.outcome == 'success'
        env:
          LOCK_GROUP: ${{ matrix.job }}
        run: |
          set -euo pipefail
          python -u -m research.conditional_duration_run --prepared "$RUNNER_TEMP/prepared-inputs/prepared" --store "$RUNNER_TEMP/duration/stores/corrected/player_match.csv" --job "$LOCK_GROUP" --reuse-models "$RUNNER_TEMP/prior-controls/study/models" --duration-domain bounded --output "$RUNNER_TEMP/evidence/study-bounded" 2>&1 | tee "$RUNNER_TEMP/evidence/bounded.log"
      - name: Fit and evaluate the mandatory source-tail sensitivity
        id: source_tail
        if: always() && steps.environment.outcome == 'success'
        env:
          LOCK_GROUP: ${{ matrix.job }}
        run: |
          set -euo pipefail
          python -u -m research.conditional_duration_run --prepared "$RUNNER_TEMP/prepared-inputs/prepared" --store "$RUNNER_TEMP/duration/stores/corrected/player_match.csv" --job "$LOCK_GROUP" --reuse-models "$RUNNER_TEMP/prior-controls/study/models" --duration-domain source_tail --output "$RUNNER_TEMP/evidence/study-source_tail" 2>&1 | tee "$RUNNER_TEMP/evidence/source-tail.log"
      - name: Record execution status without claiming objective completion
        if: always()
        env:
          LOCK_GROUP: ${{ matrix.job }}
          BOUNDED_OUTCOME: ${{ steps.bounded.outcome }}
          TAIL_OUTCOME: ${{ steps.source_tail.outcome }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          printf 'job=%s\nbounded=%s\nsource_tail=%s\nchecks=%s\nobjective=active_unfinished\n' "$LOCK_GROUP" "$BOUNDED_OUTCOME" "$TAIL_OUTCOME" "$CHECKS_OUTCOME" > "$RUNNER_TEMP/evidence/execution-status.txt"
          git diff --exit-code -- tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditional-duration-domain-${{ matrix.job }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          if-no-files-found: error
  checkpoint:
    needs: [matrix, fit]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: conditional-duration-domain-lock_*-${{ github.run_id }}
          path: ${{ runner.temp }}/lock-results
      - name: Retain complete and failed calculations on the active draft branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEST="data/unified/decision_continuation_2026-09-26/run-$GITHUB_RUN_ID"
          test ! -e "$DEST"
          mkdir -p "$DEST"
          rsync -a --exclude='*.pkl.gz' "$RUNNER_TEMP/lock-results/" "$DEST/"
          printf 'objective=active_unfinished\ncomparison=conditional_duration_domain_v2\nmodel_binaries=per-lock_GitHub_Actions_artifacts\n' > "$DEST/checkpoint-status.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DEST"
          git diff --cached --name-only | grep -v "^$DEST/" && exit 1 || true
          git commit -m "Retain full domain-sensitivity evidence $GITHUB_RUN_ID; objective remains active"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch origin codex/fantasy-decision-workflow
          git rebase FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:codex/fantasy-decision-workflow
