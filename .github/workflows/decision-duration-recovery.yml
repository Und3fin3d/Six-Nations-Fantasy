name: Audit duration domain and actual fantasy roles
on:
  push:
    branches: [codex/fantasy-decision-workflow]
    paths: [.github/workflows/decision-duration-recovery.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OMP_THREAD_LIMIT: '2'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36258801997
          name: conditional-duration-prepared-36258801997
          path: ${{ runner.temp }}/prepared-inputs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36257138991
          name: research-verified-stores-and-registrations
          path: ${{ runner.temp }}/transport
      - name: Restore exact research environment and verified stores
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-model.txt requests beautifulsoup4 pytest
          python model_env_preflight.py
          mkdir -p "$RUNNER_TEMP/stores" "$RUNNER_TEMP/evidence"
          (cd "$RUNNER_TEMP/transport" && grep 'stores.tar.gz$' sha256.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/transport/stores.tar.gz" -C "$RUNNER_TEMP/stores"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/source-commit.txt"
          python -m pip freeze > "$RUNNER_TEMP/evidence/environment.txt"
      - name: Trace every out-of-domain duration without changing the cache
        id: duration
        shell: bash
        run: |
          set -euo pipefail
          python -u -m research.duration_source_review --store "$RUNNER_TEMP/stores/corrected/player_match.csv" --output "$RUNNER_TEMP/evidence/duration" 2>&1 | tee "$RUNNER_TEMP/evidence/duration.log"
      - name: Reconcile actual role outcomes and bridge NCR diagnostic labels
        id: roles
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROLES=$(find data/unified/decision_continuation_2026-09-26/run-36257541020 -name metrics.csv -printf '%h\n')
          DIAGNOSTICS=$(find data/unified/decision_continuation_2026-09-26/run-36258130375 -name players.csv -printf '%h\n')
          test -n "$ROLES" && test -n "$DIAGNOSTICS"
          python -u -m research.decision_outcome_audit --prepared "$RUNNER_TEMP/prepared-inputs/prepared" --roles "$ROLES" --diagnostics "$DIAGNOSTICS" --output "$RUNNER_TEMP/evidence/outcomes" 2>&1 | tee "$RUNNER_TEMP/evidence/outcomes.log"
      - name: Record execution state
        if: always()
        env:
          DURATION: ${{ steps.duration.outcome }}
          ROLES: ${{ steps.roles.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          printf 'duration=%s\nroles=%s\nobjective=active_unfinished\n' "$DURATION" "$ROLES" > "$RUNNER_TEMP/evidence/execution-status.txt"
          git diff --exit-code -- tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-duration-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          if-no-files-found: error
  checkpoint:
    if: always()
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/fantasy-decision-workflow
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: decision-duration-audit-${{ github.run_id }}
          path: data/unified/decision_continuation_2026-09-26/run-${{ github.run_id }}
      - name: Preserve the complete audit without model promotion
        env:
          DEST: data/unified/decision_continuation_2026-09-26/run-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Retain duration and actual-role source audit $GITHUB_RUN_ID [skip ci]"
            git pull --rebase origin codex/fantasy-decision-workflow
            git push origin HEAD:codex/fantasy-decision-workflow
          fi
