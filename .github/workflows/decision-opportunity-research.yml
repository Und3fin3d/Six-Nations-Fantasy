name: Fantasy opportunity and decision diagnostics
on:
  push:
    branches: [codex/fantasy-decision-workflow]
    paths: [.github/workflows/decision-opportunity-research.yml]
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OMP_THREAD_LIMIT: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Und3fin3d/Six-Nations-Fantasy
          run-id: 36257138991
          name: research-verified-stores-and-registrations
          path: ${{ runner.temp }}/transport
      - name: Install exact environment and recover read-only inputs
        run: |
          set -euo pipefail
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-model.txt requests beautifulsoup4
          python model_env_preflight.py
          git lfs pull --include='data/ncr/club_player_match.csv,data/unified/complete_comparison/evidence/official.tar.gz' --exclude=''
          mkdir -p "$RUNNER_TEMP/opportunity/stores" "$RUNNER_TEMP/opportunity/evidence"
          cd "$RUNNER_TEMP/transport"
          grep 'stores.tar.gz$' sha256.txt | sha256sum -c -
          tar -xzf stores.tar.gz -C "$RUNNER_TEMP/opportunity/stores"
          cd "$GITHUB_WORKSPACE"
          git rev-parse HEAD > "$RUNNER_TEMP/opportunity/evidence/source-commit.txt"
          python -m pip freeze > "$RUNNER_TEMP/opportunity/evidence/environment.txt"
          python -m py_compile research/decision_opportunity_diagnostics.py
      - name: Analyse all retained slates and feasible alternatives
        id: analysis
        shell: bash
        run: |
          set -euo pipefail
          python -u -m research.decision_opportunity_diagnostics --original-store "$RUNNER_TEMP/opportunity/stores/original/inputs/player_match.csv" --corrected-store "$RUNNER_TEMP/opportunity/stores/corrected/player_match.csv" --roles data/unified/decision_continuation_2026-09-26/run-36257541020/role_policy --output "$RUNNER_TEMP/opportunity/evidence/diagnostics" 2>&1 | tee "$RUNNER_TEMP/opportunity/evidence/analysis.log"
      - name: Preserve evidence without duplicating original archives
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="data/unified/decision_continuation_2026-09-26/run-$GITHUB_RUN_ID"
          test ! -e "$DEST"
          mkdir -p "$DEST" "$RUNNER_TEMP/opportunity/evidence"
          rsync -a --exclude=original_archives "$RUNNER_TEMP/opportunity/evidence/" "$DEST/"
          printf 'analysis=%s\nobjective=active_unfinished\nmodels_fitted=0\n' "$ANALYSIS_OUTCOME" > "$DEST/execution-status.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DEST"
          git diff --cached --name-only | grep -v "^$DEST/" && exit 1 || true
          git commit -m "Retain full-pool opportunity diagnostics $GITHUB_RUN_ID; objective remains active"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch origin codex/fantasy-decision-workflow
          git rebase FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:codex/fantasy-decision-workflow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opportunity-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/opportunity/evidence
            !${{ runner.temp }}/opportunity/evidence/diagnostics/original_archives
          retention-days: 30
          if-no-files-found: warn
