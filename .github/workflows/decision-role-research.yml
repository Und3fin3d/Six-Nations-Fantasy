name: Registered fantasy role-policy research
on:
  push:
    branches: [codex/fantasy-decision-workflow]
    paths: [.github/workflows/decision-role-research.yml]
permissions:
  contents: write
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OMP_THREAD_LIMIT: '2'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Und3fin3d/Six-Nations-Fantasy
          run-id: 36257138991
          name: research-verified-stores-and-registrations
          path: ${{ runner.temp }}/transport
      - name: Install pinned numerical environment
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-model.txt requests beautifulsoup4 pytest
          python model_env_preflight.py
          git lfs pull --include='data/ncr/club_player_match.csv,data/unified/decision_workflow_2026-09-26/*.tar.gz' --exclude=''
      - name: Verify and recover frozen study inputs
        env:
          RUN_ROOT: ${{ runner.temp }}/role-study
        run: |
          set -euo pipefail
          mkdir -p "$RUN_ROOT/stores" "$RUN_ROOT/workflow" "$RUN_ROOT/evidence"
          cd "$RUNNER_TEMP/transport"
          grep 'stores.tar.gz$' sha256.txt | sha256sum -c -
          tar -xzf stores.tar.gz -C "$RUN_ROOT/stores"
          cd "$GITHUB_WORKSPACE"
          echo '2b70331c0cf215def67831cd27c987362e2ec8330b2afb41c8d204f48ef17313  '"$RUN_ROOT/stores/original/inputs/player_match.csv" | sha256sum -c -
          echo 'e4b20637e2b514d622bb35cc7c43762e0eddb4f3b4e50f1ca2e39155ae96e6be  '"$RUN_ROOT/stores/corrected/player_match.csv" | sha256sum -c -
          python - <<'PY'
          import hashlib, json, os, tarfile
          source = 'data/unified/decision_workflow_2026-09-26'
          hashes = json.load(open(f'{source}/bundles.json'))
          for name in ('remedies_evidence.tar.gz', 'captain_repair_evidence.tar.gz'):
              path = f'{source}/{name}'
              if hashlib.file_digest(open(path, 'rb'), 'sha256').hexdigest() != hashes[name]['sha256']:
                  raise ValueError(path)
              with tarfile.open(path) as archive:
                  archive.extractall(f'{os.environ["RUN_ROOT"]}/workflow', filter='data')
          PY
          git rev-parse HEAD > "$RUN_ROOT/evidence/source-commit.txt"
          python -m pip freeze > "$RUN_ROOT/evidence/environment.txt"
      - name: Run existing focused checks
        id: checks
        continue-on-error: true
        run: |
          python -m pytest -q tests/test_rolling_history.py::test_expected_six_nations_points_accounts_for_metres_distribution tests/test_rolling_history.py::test_robust_minutes_use_international_role_not_club_minutes tests/test_rolling_history.py::test_robust_position_rate_uses_observed_exposure tests/test_unified_ncr_gw_eval.py > "$RUNNER_TEMP/role-study/evidence/existing-checks.txt" 2>&1
      - name: Recompute previous failure mechanisms
        id: failures
        run: |
          python -u -m research.decision_failure_diagnostics --run "$RUNNER_TEMP/role-study/workflow/remedies" --output "$RUNNER_TEMP/role-study/evidence/failure_diagnostics" 2>&1 | tee "$RUNNER_TEMP/role-study/evidence/failure-diagnostics.log"
      - name: Execute the registered role-policy comparison
        id: policies
        shell: bash
        run: |
          set -euo pipefail
          python -u -m research.decision_role_policy --store "$RUNNER_TEMP/role-study/stores/original/inputs/player_match.csv" --workflow "$RUNNER_TEMP/role-study/workflow" --output "$RUNNER_TEMP/role-study/evidence/role_policy" 2>&1 | tee "$RUNNER_TEMP/role-study/evidence/role-policy.log"
      - name: Retain completed or interrupted evidence on the same draft PR branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          FAILURES_OUTCOME: ${{ steps.failures.outcome }}
          POLICIES_OUTCOME: ${{ steps.policies.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="data/unified/decision_continuation_2026-09-26/run-$GITHUB_RUN_ID"
          test ! -e "$DEST"
          mkdir -p "$DEST" "$RUNNER_TEMP/role-study/evidence"
          cp -a "$RUNNER_TEMP/role-study/evidence/." "$DEST/"
          printf 'checks=%s\nfailures=%s\npolicies=%s\nobjective=active_unfinished\n' "$CHECKS_OUTCOME" "$FAILURES_OUTCOME" "$POLICIES_OUTCOME" > "$DEST/execution-status.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DEST"
          git diff --cached --name-only | grep -v "^$DEST/" && exit 1 || true
          git commit -m "Retain registered role-study evidence $GITHUB_RUN_ID; objective remains active"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch origin codex/fantasy-decision-workflow
          git rebase FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:codex/fantasy-decision-workflow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registered-role-study-${{ github.run_id }}
          path: ${{ runner.temp }}/role-study/evidence
          retention-days: 30
          if-no-files-found: warn
