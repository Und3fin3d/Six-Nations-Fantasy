name: Export original frozen regression input
on:
  push:
    branches: [codex/friendly-stat-validation-20260919]
    paths: [.github/workflows/export-frozen-regression-input.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          persist-credentials: false
      - name: Retrieve and verify the original model, without running it
        run: |
          path=data/unified/raw_benchmark/v1/models/p3_event_50/nations_championship_2026.pkl
          git lfs pull --include="$path" --exclude=''
          echo "79da46093fc497cb1f694da32b951bb221c162e955a9ce064d05b4318d857439  $path" | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-p3-regression-input
          path: data/unified/raw_benchmark/v1/models/p3_event_50/nations_championship_2026.pkl
          retention-days: 3
          if-no-files-found: error
