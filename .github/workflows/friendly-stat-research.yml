name: Friendly-15 and bounded domain research

on:
  push:
    branches: [codex/friendly-stat-validation-20260919]
    paths: [.github/workflows/friendly-stat-research.yml]

permissions:
  contents: read
  actions: read

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PYTHONWARNINGS: ignore
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Restore locally tested source with exact integrity verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/git/blobs/d7b78b5fc146e47a6d98ef640529a1381fc938b9 --jq .content > /tmp/source.b64
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          text = ''.join(Path('/tmp/source.b64').read_text().split())
          for transmitted, original in [('GfpU7i4gs3','GfpU7i2gs3'), ('BvncU3vj','BvncUvj'), ('FTUT6vJiQ+LwT7','FTUT6vJiQ+TwT7'), ('4tVqsWMe','4tVqsMe')]:
              text = text.replace(transmitted, original)
          text = text.rstrip('=')
          text += '=' * (-len(text) % 4)
          patch = gzip.decompress(base64.b64decode(text))
          assert hashlib.sha256(patch).hexdigest() == 'd67184c9f76d980fcacbf1c32d33afe2ad8b9f5135e110c1bf87d5f0f4757d64'
          Path('/tmp/friendly.patch').write_bytes(patch)
          PY
          git apply --check /tmp/friendly.patch
          git apply /tmp/friendly.patch
          git diff --check
          python -m compileall -q model tests
      - id: commit
        name: Save source and tests on the isolated research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model tests/test_friendly_eval.py tests/test_domain_weights.py data/unified/friendly15/*.json
          git commit -m 'Add immutable Friendly-15 metrics and consistent domain-weighted residuals'
          git push origin HEAD:codex/friendly-stat-validation-20260919
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  prepare:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          lfs: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pinned-cpu-environment
          run-id: 35467219925
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/env
      - name: Restore pinned numerical environment and required original data
        run: |
          mkdir "$RUNNER_TEMP/py311"
          tar -xzf "$RUNNER_TEMP/env/6n-python311.tar.gz" -C "$RUNNER_TEMP/py311"
          echo "PYTHONHOME=$RUNNER_TEMP/py311" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/py311/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/py311/bin" >> "$GITHUB_PATH"
          git lfs pull --include='data/unified/player_match.csv,data/unified/raw_benchmark/v1/player_match.csv,data/ncr/club_player_match.csv,data/unified/raw_benchmark/v1/models/p3_event_50/nations_championship_2026.pkl' --exclude=''
      - name: Verify entire repository and prepare shared inputs
        run: |
          python -m pip install 'beautifulsoup4>=4.12,<5' 'requests>=2.31,<3'
          python model_env_preflight.py
          git rev-parse HEAD > tested-commit.txt
          python -m pip freeze > tested-environment.txt
          python -m pytest -q tests | tee full-tests.txt
          python -u -m model.unified.domain_experiment --prepare-only --output results
          cp data/ncr/club_player_match.csv results/inputs/club_player_match.csv
          tar -czf prepared-inputs.tar.gz -C results inputs
      - uses: actions/upload-artifact@v4
        with:
          name: friendly-prepared-inputs
          path: prepared-inputs.tar.gz
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: friendly-full-validation
          path: |
            full-tests.txt
            tested-commit.txt
            tested-environment.txt
          retention-days: 7

  development:
    needs: [source, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        fixture: ['8476315','8472247','8472337','8476324','8476333','8476342','8476351','8476360','8472346','8476369','8472256','8476378']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          lfs: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pinned-cpu-environment
          run-id: 35467219925
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/env
      - uses: actions/download-artifact@v4
        with:
          name: friendly-prepared-inputs
          path: ${{ runner.temp }}/inputs
      - name: Restore pinned environment and shared inputs
        run: |
          mkdir "$RUNNER_TEMP/py311" results
          tar -xzf "$RUNNER_TEMP/env/6n-python311.tar.gz" -C "$RUNNER_TEMP/py311"
          tar -xzf "$RUNNER_TEMP/inputs/prepared-inputs.tar.gz" -C results
          cp results/inputs/club_player_match.csv data/ncr/club_player_match.csv
          echo "PYTHONHOME=$RUNNER_TEMP/py311" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/py311/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/py311/bin" >> "$GITHUB_PATH"
      - name: Fit predeclared candidates at this historical lock
        run: python -u -m model.unified.domain_experiment --output results --job dev:${{ matrix.fixture }} | tee run.log
      - uses: actions/upload-artifact@v4
        with:
          name: friendly-development-${{ matrix.fixture }}
          path: |
            results/jobs/dev_${{ matrix.fixture }}
            run.log
          retention-days: 7

  selection:
    needs: [source, development]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      engines: ${{ steps.select.outputs.engines }}
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: pinned-cpu-environment
          run-id: 35467219925
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/env
      - uses: actions/download-artifact@v4
        with:
          pattern: friendly-development-*
          path: development
      - name: Restore numerical environment
        run: |
          mkdir "$RUNNER_TEMP/py311"
          tar -xzf "$RUNNER_TEMP/env/6n-python311.tar.gz" -C "$RUNNER_TEMP/py311"
          echo "PYTHONHOME=$RUNNER_TEMP/py311" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/py311/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/py311/bin" >> "$GITHUB_PATH"
      - id: select
        name: Freeze selection before viewing the 15 test games or fantasy results
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          from model.unified.domain_experiment import select_development, CONTROL
          from model.unified.friendly_eval import summarise_stats
          files = sorted(Path('development').rglob('metrics.csv'))
          assert len(files) == 12, files
          manifests = [json.loads(p.read_text()) for p in Path('development').rglob('manifest.json')]
          assert len(manifests) == 12
          for key in ['source_sha256', 'store_sha256', 'features_sha256', 'weight_config_sha256', 'candidate_configs']:
              assert all(m[key] == manifests[0][key] for m in manifests), key
          metrics = pd.concat([pd.read_csv(p,dtype={'fixture_id':str}) for p in files],ignore_index=True)
          fixture_ids = [f['fixture_id'] for f in json.loads(Path('data/unified/friendly15/development_fixtures.json').read_text())['fixtures']]
          selection = select_development(metrics, fixture_ids)
          selection['source_sha256'] = manifests[0]['source_sha256']
          selection['store_sha256'] = manifests[0]['store_sha256']
          selection['development_metrics_sha256'] = __import__('hashlib').sha256(metrics.to_csv(index=False).encode()).hexdigest()
          Path('data/unified/friendly15/selection.json').write_text(json.dumps(selection,indent=2,sort_keys=True)+'\n')
          metrics.to_csv('data/unified/friendly15/development_metrics.csv',index=False)
          summary, per_stat = summarise_stats(metrics, fixture_ids)
          print(summary.to_string(index=False))
          print('SELECTED:', selection['selected'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('engines='+CONTROL+(' '+selection['selected'] if selection['selected'] else '')+'\n')
              out.write('selected='+str(selection['selected'] is not None).lower()+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/unified/friendly15/selection.json data/unified/friendly15/development_metrics.csv
          git commit -m 'Freeze development-only domain selection before confirmation'
          git push origin HEAD:codex/friendly-stat-validation-20260919
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: friendly-development-evidence
          path: |
            development
            data/unified/friendly15/selection.json
            data/unified/friendly15/development_metrics.csv
          retention-days: 7

  confirmation:
    needs: [source, prepare, selection]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        job: ['test:8518300','test:8518309','test:8518390','test:8518318','test:8544553','test:8518327','test:8518336','test:8518345','test:8518354','test:8518363','test:8518372','test:8546596','test:8553454','test:8546605','test:8545138','six_nations_2025_r1','six_nations_2025_r2','six_nations_2025_r3','six_nations_2025_r4','six_nations_2025_r5','six_nations_2026_r1','six_nations_2026_r2','six_nations_2026_r3','six_nations_2026_r4','six_nations_2026_r5','ncr_2026_r1','ncr_2026_r2','ncr_2026_r3']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.selection.outputs.sha }}
          lfs: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pinned-cpu-environment
          run-id: 35467219925
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/env
      - uses: actions/download-artifact@v4
        with:
          name: friendly-prepared-inputs
          path: ${{ runner.temp }}/inputs
      - name: Restore pinned environment and shared inputs
        run: |
          mkdir "$RUNNER_TEMP/py311" results
          tar -xzf "$RUNNER_TEMP/env/6n-python311.tar.gz" -C "$RUNNER_TEMP/py311"
          tar -xzf "$RUNNER_TEMP/inputs/prepared-inputs.tar.gz" -C results
          cp results/inputs/club_player_match.csv data/ncr/club_player_match.csv
          echo "PYTHONHOME=$RUNNER_TEMP/py311" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/py311/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/py311/bin" >> "$GITHUB_PATH"
      - name: Compare only the previously selected candidate and fixed controls
        run: python -u -m model.unified.domain_experiment --output results --job '${{ matrix.job }}' --engines ${{ needs.selection.outputs.engines }} | tee run.log
      - name: Package prediction evidence without training tables or fitted binaries
        run: |
          tar -czf evidence.tar.gz -C results jobs
          name='${{ matrix.job }}'
          echo "ARTIFACT_SUFFIX=${name//:/_}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: friendly-confirmation-${{ env.ARTIFACT_SUFFIX }}
          path: |
            evidence.tar.gz
            run.log
          retention-days: 7

  collect:
    needs: [selection, confirmation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: friendly-confirmation-*
          path: confirmation
      - uses: actions/download-artifact@v4
        with:
          name: friendly-development-evidence
          path: development
      - uses: actions/download-artifact@v4
        with:
          name: friendly-full-validation
          path: validation
      - name: Archive complete evidence
        run: tar -czf friendly-research-evidence.tar.gz confirmation development validation
      - uses: actions/upload-artifact@v4
        with:
          name: friendly-research-evidence
          path: friendly-research-evidence.tar.gz
          retention-days: 7
