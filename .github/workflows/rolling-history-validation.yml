name: Rolling history validation

on:
  push:
    branches: [codex/rolling-history-parity-20260919]
    paths: [.github/workflows/rolling-history-validation.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rolling-history-fixed-masks
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '2'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  OUTPUT_DIR: data/unified/rolling_history_v2

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      revision: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/rolling-history-parity-20260919
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-model.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install -q -r requirements-model.txt pytest
          python -m pip install -q torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: rolling-input
          run-id: 35461768013
          github-token: ${{ github.token }}
          path: data/unified/rolling_history_v2
      - name: Repair shared identities, test, and validate every round
        run: |
          git lfs install --local
          cp "$OUTPUT_DIR/club_player_match.csv" data/ncr/club_player_match.csv
          python .github/scripts/repair_rolling_identity.py
          python -m pytest -q tests/test_rolling_history.py tests/test_candidate_outcome_mask.py tests/test_rolling_identity.py tests/test_unified_raw_benchmark.py tests/test_unified_model.py | tee "$OUTPUT_DIR/tests.log"
          python - <<'PY'
          import os
          from pathlib import Path
          from model.unified.rolling_evaluation import prepare_store, cohort, ROUND_IDS, GRAIN
          store = prepare_store(Path(os.environ['OUTPUT_DIR']))
          for round_id in ROUND_IDS:
              cutoff, candidates, labels, baseline = cohort(store, round_id)
              assert len(candidates) == len(labels), (round_id, 'cohort length')
              duplicates = candidates[candidates.duplicated(GRAIN, keep=False)]
              assert duplicates.empty, (round_id, duplicates[GRAIN + ['player_name']].to_dict('records'))
              assert not candidates.filter(like='available__').any().any(), round_id
              print(round_id, cutoff, len(candidates), flush=True)
          PY
          python -m pip freeze > "$OUTPUT_DIR/environment.txt"
          git diff --check
      - name: Save tested identity fix on the working branch
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model tests
          if ! git diff --cached --quiet; then
            git commit -m 'Share verified player-history IDs between empirical and unified predictions'
            git pull --rebase --autostash origin codex/rolling-history-parity-20260919
            git push origin HEAD:codex/rolling-history-parity-20260919
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: rolling-input-validated
          path: data/unified/rolling_history_v2
          retention-days: 7
          compression-level: 1

  compare:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        round: [6n-2025-r1, 6n-2025-r2, 6n-2025-r3, 6n-2025-r4, 6n-2025-r5, 6n-2026-r1, 6n-2026-r2, 6n-2026-r3, 6n-2026-r4, 6n-2026-r5, ncr-2026-gw1, ncr-2026-gw2, ncr-2026-gw3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-model.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install -q -r requirements-model.txt pytest
          python -m pip install -q torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: rolling-input-validated
          path: data/unified/rolling_history_v2
      - name: Fit and compare using all prior rounds
        run: |
          cp "$OUTPUT_DIR/club_player_match.csv" data/ncr/club_player_match.csv
          python -u -m model.unified.rolling_evaluation --output "$OUTPUT_DIR" --round '${{ matrix.round }}' 2>&1 | tee "$OUTPUT_DIR/${{ matrix.round }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.round }}
          path: |
            data/unified/rolling_history_v2/${{ matrix.round }}
            data/unified/rolling_history_v2/${{ matrix.round }}.log
          retention-days: 14

  report:
    needs: [prepare, compare]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/rolling-history-parity-20260919
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-model.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install -q -r requirements-model.txt
          python -m pip install -q torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: data/unified/rolling_history_v2
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: rolling-input-validated
          path: /tmp/rolling-input
      - name: Preserve compact results on the working branch without a PR
        run: |
          cp /tmp/rolling-input/tests.log /tmp/rolling-input/environment.txt /tmp/rolling-input/store_manifest.json /tmp/rolling-input/source_report.json "$OUTPUT_DIR/"
          python -m model.unified.rolling_evaluation --output "$OUTPUT_DIR" --summarize 2>&1 | tee "$OUTPUT_DIR/REPORT.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT_DIR"/{metrics.csv,summary.csv,decision.json,REPORT.txt,tests.log,environment.txt,store_manifest.json,source_report.json}
          find "$OUTPUT_DIR" -mindepth 2 -maxdepth 2 \( -name '*.csv' -o -name manifest.json -o -name metrics.json \) -print0 | xargs -0 -r git add
          if ! git diff --cached --quiet; then
            git commit -m 'Record rolling comparison and fixed challengers without promotion'
            git pull --rebase --autostash origin codex/rolling-history-parity-20260919
            git push origin HEAD:codex/rolling-history-parity-20260919
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rolling-evaluation-report
          path: data/unified/rolling_history_v2
          retention-days: 14
