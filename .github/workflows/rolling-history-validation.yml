name: Rolling history validation

on:
  push:
    branches:
      - codex/rolling-history-parity-20260919
    paths:
      - .github/workflows/rolling-history-validation.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rolling-history-validation
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download prepared runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35459997007 --repo Und3fin3d/Six-Nations-Fantasy --name 6n-python311 --dir /tmp/runtime
      - name: Split below connector file-size limit
        run: split -b 450M /tmp/runtime/6n-python311.tar.gz /tmp/python-part-
      - uses: actions/upload-artifact@v4
        with:
          name: 6n-python311-part-aa
          path: /tmp/python-part-aa
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: 6n-python311-part-ab
          path: /tmp/python-part-ab
          retention-days: 3
          if-no-files-found: error
