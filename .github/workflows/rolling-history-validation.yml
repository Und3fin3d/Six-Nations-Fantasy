name: Rolling history validation

on:
  push:
    branches: [codex/rolling-history-parity-20260919]
    paths: [.github/workflows/rolling-history-validation.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rolling-history-complete-round
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '2'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  OUTPUT_DIR: data/unified/rolling_history_v3

jobs:
  first-round:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    outputs:
      revision: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/rolling-history-parity-20260919
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-model.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install -q -r requirements-model.txt pytest
          python -m pip install -q torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: rolling-input-validated
          run-id: 35462762075
          github-token: ${{ github.token }}
          path: data/unified/rolling_history_v3
      - name: Apply tested source fixes
        id: commit
        run: |
          git lfs install --local
          cp "$OUTPUT_DIR/club_player_match.csv" data/ncr/club_player_match.csv
          python .github/scripts/repair_rolling_identity.py
          python -m pytest -q tests/test_rolling_history.py tests/test_candidate_outcome_mask.py tests/test_rolling_identity.py tests/test_unified_raw_benchmark.py tests/test_unified_model.py | tee "$OUTPUT_DIR/tests.log"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model tests
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize output paths for rolling-round manifests'
            git pull --rebase --autostash origin codex/rolling-history-parity-20260919
            git push origin HEAD:codex/rolling-history-parity-20260919
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python -m pip freeze > "$OUTPUT_DIR/environment.txt"
      - name: Complete first round end to end before parallel evaluation
        run: python -u -m model.unified.rolling_evaluation --output "$OUTPUT_DIR" --round 6n-2025-r1 2>&1 | tee "$OUTPUT_DIR/6n-2025-r1.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-6n-2025-r1
          path: |
            data/unified/rolling_history_v3/6n-2025-r1
            data/unified/rolling_history_v3/6n-2025-r1.log
            data/unified/rolling_history_v3/tests.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: rolling-input
          path: |
            data/unified/rolling_history_v3/player_match.csv
            data/unified/rolling_history_v3/club_player_match.csv
            data/unified/rolling_history_v3/store_manifest.json
            data/unified/rolling_history_v3/source_report.json
            data/unified/rolling_history_v3/tests.log
            data/unified/rolling_history_v3/environment.txt
          compression-level: 1
          retention-days: 14

  compare:
    needs: first-round
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        round: [6n-2025-r2, 6n-2025-r3, 6n-2025-r4, 6n-2025-r5, 6n-2026-r1, 6n-2026-r2, 6n-2026-r3, 6n-2026-r4, 6n-2026-r5, ncr-2026-gw1, ncr-2026-gw2, ncr-2026-gw3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.first-round.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-model.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install -q -r requirements-model.txt
          python -m pip install -q torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: rolling-input
          path: data/unified/rolling_history_v3
      - name: Fit and compare using all prior rounds
        run: |
          cp "$OUTPUT_DIR/club_player_match.csv" data/ncr/club_player_match.csv
          python -u -m model.unified.rolling_evaluation --output "$OUTPUT_DIR" --round '${{ matrix.round }}' 2>&1 | tee "$OUTPUT_DIR/${{ matrix.round }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.round }}
          path: |
            data/unified/rolling_history_v3/${{ matrix.round }}
            data/unified/rolling_history_v3/${{ matrix.round }}.log
          retention-days: 14

  report:
    needs: [first-round, compare]
    if: ${{ always() && needs.first-round.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/rolling-history-parity-20260919
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-model.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install -q -r requirements-model.txt
          python -m pip install -q torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: data/unified/rolling_history_v3
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: rolling-input
          path: /tmp/rolling-input
      - name: Preserve compact results without a PR
        run: |
          cp /tmp/rolling-input/tests.log /tmp/rolling-input/environment.txt /tmp/rolling-input/store_manifest.json /tmp/rolling-input/source_report.json "$OUTPUT_DIR/"
          python -m model.unified.rolling_evaluation --output "$OUTPUT_DIR" --summarize 2>&1 | tee "$OUTPUT_DIR/REPORT.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT_DIR"/{metrics.csv,summary.csv,decision.json,REPORT.txt,tests.log,environment.txt,store_manifest.json,source_report.json}
          find "$OUTPUT_DIR" -mindepth 2 -maxdepth 2 \( -name '*.csv' -o -name manifest.json -o -name metrics.json \) -print0 | xargs -0 -r git add
          if ! git diff --cached --quiet; then
            git commit -m 'Record complete rolling comparison without promotion'
            git pull --rebase --autostash origin codex/rolling-history-parity-20260919
            git push origin HEAD:codex/rolling-history-parity-20260919
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rolling-evaluation-report
          path: data/unified/rolling_history_v3
          retention-days: 14
