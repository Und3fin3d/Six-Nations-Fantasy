name: Rolling model research (no promotion)

on:
  push:
    branches:
      - codex/rolling-model-evaluation-20260919
    paths:
      - .github/workflows/rolling-model-research.yml

permissions:
  contents: read

jobs:
  export-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          persist-credentials: false
      - name: Download only required historical tables
        run: |
          git lfs pull --include="data/unified/player_match.csv,data/unified/raw_benchmark/v1/player_match.csv,data/ncr/club_player_match.csv" --exclude=""
      - name: Archive research inputs for the isolated local runner
        run: |
          tar --exclude='./.git' -czf "$RUNNER_TEMP/6n-research-checkout.tar.gz" .
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: research-checkout
          path: |
            ${{ runner.temp }}/6n-research-checkout.tar.gz
            ${{ runner.temp }}/source-commit.txt
          retention-days: 3
          if-no-files-found: error
