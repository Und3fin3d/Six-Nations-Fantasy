name: Rolling model research (no promotion)

on:
  push:
    branches:
      - codex/rolling-model-evaluation-20260919
    paths:
      - .github/workflows/rolling-model-research.yml

permissions:
  contents: read
  actions: read

jobs:
  split-pinned-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pinned-cpu-environment
          run-id: 35467219925
          github-token: ${{ github.token }}
          path: environment
      - name: Split environment archive
        run: split -b 350M -d environment/6n-python311.tar.gz environment/part-
      - uses: actions/upload-artifact@v4
        with:
          name: environment-part-00
          path: environment/part-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: environment-part-01
          path: environment/part-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: environment-part-02
          path: environment/part-02
          compression-level: 0
          retention-days: 1
