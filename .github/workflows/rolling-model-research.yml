name: Rolling model research (no promotion)

on:
  push:
    branches:
      - codex/rolling-model-evaluation-20260919
    paths:
      - .github/workflows/rolling-model-research.yml

permissions:
  contents: read

jobs:
  export-pinned-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned CPU model dependencies
        run: |
          python -m pip install --no-cache-dir torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r requirements-model.txt -r requirements-unified.txt pytest
          python model_env_preflight.py
          python -m pip freeze > "$RUNNER_TEMP/requirements-resolved.txt"
      - name: Export isolated Python environment
        run: |
          tar -czf "$RUNNER_TEMP/6n-python311.tar.gz" -C "$pythonLocation" .
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-cpu-environment
          path: |
            ${{ runner.temp }}/6n-python311.tar.gz
            ${{ runner.temp }}/requirements-resolved.txt
          retention-days: 1
          if-no-files-found: error
