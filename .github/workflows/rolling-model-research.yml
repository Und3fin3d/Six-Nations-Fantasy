name: Rolling model research (no promotion)

on:
  push:
    branches: [codex/rolling-model-evaluation-20260919]
    paths: [.github/workflows/rolling-model-research.yml]

permissions:
  contents: read
  actions: read

jobs:
  full-regression-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pinned-cpu-environment
          run-id: 35467219925
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/environment-archive
      - name: Restore pinned environment and required original LFS data
        run: |
          mkdir "$RUNNER_TEMP/py311"
          tar -xzf "$RUNNER_TEMP/environment-archive/6n-python311.tar.gz" -C "$RUNNER_TEMP/py311"
          echo "PYTHONHOME=$RUNNER_TEMP/py311" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/py311/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/py311/bin" >> "$GITHUB_PATH"
          echo 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1' >> "$GITHUB_ENV"
          echo 'PYTHONWARNINGS=ignore' >> "$GITHUB_ENV"
          echo 'OMP_NUM_THREADS=2' >> "$GITHUB_ENV"
          echo 'OPENBLAS_NUM_THREADS=1' >> "$GITHUB_ENV"
          git lfs pull --include='data/unified/player_match.csv,data/unified/raw_benchmark/v1/player_match.csv,data/ncr/club_player_match.csv,data/unified/raw_benchmark/v1/models/p3_event_50/nations_championship_2026.pkl' --exclude=''
      - name: Add parser test dependencies without changing the model stack
        run: python -m pip install 'beautifulsoup4>=4.12,<5' 'requests>=2.31,<3'
      - name: Run the entire regression suite
        run: |
          python model_env_preflight.py
          git rev-parse HEAD > tested-commit.txt
          python -m pip freeze > tested-environment.txt
          python -m pytest -q tests | tee full-tests.txt
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rolling-full-validation
          path: |
            full-tests.txt
            tested-commit.txt
            tested-environment.txt
          retention-days: 7
