name: Stop superseded friendly experiment
on:
  push:
    branches: [codex/friendly-stat-validation-20260919]
    paths: [.github/workflows/stop-incomplete-friendly-run.yml]
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Stop this research branch's incomplete-cohort run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/Und3fin3d/Six-Nations-Fantasy/actions/runs/35475086184/cancel
